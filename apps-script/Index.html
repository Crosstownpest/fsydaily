<!DOCTYPE html>
<html>
<head>
<base target="_blank">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Barlow:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#eef1f4; --surface:#fff; --ink:#18212b; --muted:#5b6774; --line:#d5dbe2;
  --navy:#1d3047; --brass:#b5821f; --brass-soft:#f3e6c9; --good:#2f7d4f; --good-soft:#dcefe3;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-read:"Source Serif 4",Georgia,serif;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10161d; --surface:#18212b; --ink:#e7ebef; --muted:#9aa6b2; --line:#2a3542;
  --navy:#0b121a; --brass:#e0ad48; --brass-soft:#3a2f17; --good:#5cc489; --good-soft:#173826; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
a{color:var(--brass)}
button,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.board{background:var(--navy);color:#eef2f6;padding:20px 0 22px}
.board .wrap{display:grid;gap:14px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:56px;height:56px;border-radius:13px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;font-size:.82rem;color:#d9b061;font-weight:600}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1}
.today-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-family:var(--f-display);font-size:1.1rem}
.today-row strong{font-size:1.6rem;color:#f2c96f}
.bar{height:14px;border-radius:7px;background:rgba(255,255,255,.14);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#c8922b,#f2c96f);border-radius:7px;transition:width .6s}
.labels,.roster li{display:grid;grid-template-columns:1.6rem minmax(0,1fr) auto auto;align-items:center;gap:10px}
.labels{padding:0 10px;font-size:.7rem;color:#aab6c3;text-transform:uppercase;letter-spacing:.08em}
.labels .dl{display:flex;gap:4px}.labels .dl span{width:12px;text-align:center}
.roster{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.roster li{padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.06)}
.roster li.me{background:rgba(242,201,111,.18)}
.rank{font-family:var(--f-display);font-weight:700;color:#d9b061;text-align:center}
.who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.who .chip{display:inline-block;margin-left:8px;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:10px;vertical-align:1px}
.chip.in{background:#5cc489;color:#0d2a19}
.chip.out{background:rgba(255,255,255,.12);color:#c0cad4}
.dots{display:flex;gap:4px}
.dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.16)}
.dot.on{background:#5cc489}.dot.today{box-shadow:0 0 0 2px #f2c96f}
.dot.future{background:transparent;border:1px dashed rgba(255,255,255,.25)}
.streak{font-family:var(--f-display);color:#f2c96f;min-width:3.2rem;text-align:right}
.board .note{color:#c0cad4;font-size:.95rem;margin:0}

main{padding:20px 0 48px}
.whoami{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.whoami label{font-weight:600}
.whoami select{flex:1;min-width:180px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.whoami.set{padding:8px 14px;justify-content:space-between}
.linkbtn{background:none;border:0;color:var(--brass);text-decoration:underline;padding:0}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav button{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font-weight:600}
.nav button:disabled{opacity:.35;cursor:default}
.nav .date{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;text-align:center}
.nav .date small{display:block;font-family:var(--f-ui);font-size:.75rem;color:var(--muted);text-transform:none;letter-spacing:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tag{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 20px;background:var(--brass-soft);font-size:.88rem}
.tag b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.82rem}
.body{padding:22px 20px 8px;display:grid;gap:16px}
h2{margin:0;font-family:var(--f-display);font-size:clamp(1.6rem,5vw,2.1rem);line-height:1.05}
.read{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1px dashed var(--brass);border-radius:10px}
.lbl{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:.8rem;color:var(--muted)}
.read a{font-family:var(--f-read);font-weight:600;font-size:1.1rem;text-decoration:none}
.thought{font-family:var(--f-read);font-size:1.12rem;line-height:1.65;margin:0}
.ponder{border-left:4px solid var(--brass);padding:4px 0 4px 14px}
.ponder .lbl{color:var(--brass);font-weight:600}
.ponder p{margin:2px 0 0;font-family:var(--f-read);font-style:italic;font-size:1.1rem}
.foot{padding:16px 20px 22px;display:grid;gap:12px;border-top:1px solid var(--line);margin-top:10px}
.foot label{font-size:.9rem;color:var(--muted)}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:var(--bg);color:var(--ink)}
.confirm{border:0;border-radius:10px;padding:14px 18px;background:var(--brass);color:#1a1205;font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.05em;text-transform:uppercase}
.confirm:disabled{opacity:.6;cursor:default}
.done{padding:14px 16px;border-radius:10px;background:var(--good-soft);color:var(--good);font-weight:600}
.small{font-size:.85rem;color:var(--muted);margin:0}
.err{color:#c0392b;font-size:.9rem;margin:0}
.loading{padding:40px 20px;text-align:center;color:var(--muted)}
.foot-links{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;padding:0 16px 32px;font-size:.88rem}
.alt{padding:20px 16px 40px;display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
.panel h3{margin:0;font-family:var(--f-display);font-size:1.35rem}
.field{display:grid;gap:6px}.field label{font-weight:600;font-size:.92rem}
.field input,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink)}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row2 input{flex:1;min-width:160px}
.btn2{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600}
.btn2.danger{color:#c0392b}
.codebig{font-family:var(--f-display);font-size:2rem;letter-spacing:.12em;color:var(--brass);font-weight:700}
.grid{overflow-x:auto}.grid table{border-collapse:collapse;width:100%;font-size:.9rem}
.grid th,.grid td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center}
.grid th:first-child,.grid td:first-child{text-align:left}
.grid .y{color:var(--good);font-weight:700}.grid .n{color:#c0392b}
.resp{border-top:1px solid var(--line);padding-top:10px}
.resp .meta{font-size:.82rem;color:var(--muted)}.resp p{margin:4px 0 0;font-family:var(--f-read)}
.row2 input,.panel select{padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink)}
.hero{text-align:center;display:grid;justify-items:center;gap:8px;padding:8px 8px 4px}
.hero img{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.hero h2{margin:4px 0 0;font-family:var(--f-display);font-size:2rem}
.mission{margin:0;max-width:34ch;font-family:var(--f-read);font-size:1.08rem;line-height:1.55;color:var(--muted)}
.guide{margin:0;padding-left:20px;display:grid;gap:10px}.guide p,.faq p{margin:2px 0 0}
.faq{border-top:1px solid var(--line);padding-top:8px}
.btn2.picked{border-color:var(--brass);background:var(--brass-soft)}
.foot-links .linkbtn{font-size:.85rem}
.names{display:grid;gap:8px}
.namebtn{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-weight:600;font-size:1.05rem}
.namebtn.taken{opacity:.7}
.qr{display:flex;justify-content:center;padding:8px;background:#fff;border-radius:10px;width:max-content;margin:0 auto}
.boys{display:grid}
.boy{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.boyname{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;font-weight:600}
.chip2{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:10px}
.chip2.ok{background:var(--good-soft);color:var(--good)}.chip2.wait{background:var(--brass-soft);color:var(--brass)}
.dots2{display:flex;gap:3px}.d2{width:9px;height:9px;border-radius:50%;background:var(--line)}.d2.on{background:var(--good)}.d2.fut{background:transparent;border:1px dashed var(--line)}
.acts .btn2{padding:6px 10px;font-size:.88rem}
#addNames{flex:1;min-width:180px}
.rlist{display:grid;gap:6px}.rlist div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<header class="board">
  <div class="wrap">
    <div class="brand"><img src="https://cdn.prod.website-files.com/571e75edbd5a690c420161f4/6ad91704cdda56e5dd879be5_fsy-icon-1024.png" alt="" width="56" height="56"><div><div class="eyebrow" id="eyebrow">Aaronic Priesthood · Daily Prep</div><h1>Ready for Sunday</h1></div></div>
    <div class="today-row"><span id="todayLabel">Today</span><span><strong id="todayCount">–</strong> in today</span></div>
    <div class="bar"><span id="todayBar"></span></div>
    <div class="labels" id="labels"></div>
    <ol class="roster" id="roster"></ol>
    <p class="note" id="boardNote">Loading the quorum…</p>
  </div>
</header>
<main class="wrap">
  <div id="whoami"></div>
  <div class="nav">
    <button id="prev">‹ Prev</button>
    <div class="date" id="navDate"></div>
    <button id="next">Next ›</button>
  </div>
  <article class="card" id="card"><div class="loading">Loading today's reading…</div></article>
</main>
<section class="wrap alt" id="alt" hidden></section>
<nav class="foot-links" id="footLinks">
  <button class="linkbtn" id="lnkCode" type="button">Home</button>
  <button class="linkbtn" id="lnkLeader" type="button">Leaders</button>
  <button class="linkbtn" id="lnkSetup" type="button">How it works</button>
  <button class="linkbtn" id="lnkFeedback" type="button">Feedback</button>
</nav>
<p class="small" style="text-align:center;padding:0 16px 28px;margin:-18px 0 0">Not an official app of The Church of Jesus Christ of Latter-day Saints.</p>

<script>
var WARD_PARAM = <?!= JSON.stringify(wardParam) ?>;
var NAME_PARAM = <?!= JSON.stringify(nameParam) ?>;
var INVITE_PARAM = <?!= JSON.stringify(inviteParam) ?>;
var LEADER_PARAM = <?!= JSON.stringify(leaderParam) ?>;
var JOIN_PARAM = <?!= JSON.stringify(joinParam) ?>;
var APP_URL = <?!= JSON.stringify(appUrl) ?>;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}return null;}
var WARD = WARD_PARAM || ls("fsy-ward") || "";
if (WARD_PARAM) ls("fsy-ward", WARD_PARAM);
function nameKey(){return WARD ? "fsy-name-"+WARD : "fsy-name";}
if (LEADER_PARAM) ls("fsy-leader", LEADER_PARAM);
var INVITE = INVITE_PARAM || ls("fsy-invite") || "";
if (INVITE_PARAM) ls("fsy-invite", INVITE_PARAM);
var D=null, me=ls(nameKey()), viewing=null, saving=false, errMsg="";
var LEGACY = !WARD && !INVITE && !!ls("fsy-name");
function tellParent(){try{window.top.postMessage({fsy:{i:INVITE,w:WARD,n:me||""}},"*");}catch(e){}}
var FALLBACK={title:"Today's reading is on its way",ref:"This month's For the Strength of Youth",
  refUrl:"https://www.churchofjesuschrist.org/study/magazines/for-the-strength-of-youth?lang=eng",
  thought:"The daily reading for today hasn't been posted yet. Open this month's magazine, read the Sunday lesson for this week or any article that catches your eye, and spend a couple of minutes thinking about it.",
  ask:"What is one thing you read today that you could bring to Sunday's discussion?",lesson:"",lessonUrl:""};

function parse(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}
function iso(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function shift(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function fmt(s,o){return parse(s).toLocaleDateString(undefined,o);}
function sundayFor(s){var d=parse(s);d.setDate(d.getDate()+(7-d.getDay())%7);return iso(d);}
function weekOf(s){var sun=sundayFor(s),a=[];for(var i=6;i>=0;i--)a.push(shift(sun,-i));return a;}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}

function daysFor(name){var o={};D.checkins.forEach(function(c){if(c.name===name)o[c.date]=1;});return o;}
function streak(days){var d=D.today;if(!days[d])d=shift(d,-1);var n=0;while(days[d]){n++;d=shift(d,-1);}return n;}

function renderBoard(){
  var wk=weekOf(D.today), today=D.today;
  var rows=D.roster.map(function(n){var days=daysFor(n);return{name:n,days:days,week:wk.filter(function(d){return days[d];}).length,streak:streak(days),today:!!days[today]};})
    .sort(function(a,b){return b.week-a.week||b.streak-a.streak||a.name.localeCompare(b.name);});
  var done=rows.filter(function(r){return r.today;}).length;
  document.getElementById("todayLabel").textContent=fmt(today,{weekday:"long",month:"short",day:"numeric"});
  document.getElementById("todayCount").textContent=done+" of "+rows.length;
  document.getElementById("todayBar").style.width=(rows.length?Math.round(done/rows.length*100):0)+"%";
  var labels=document.getElementById("labels");
  labels.innerHTML='<span></span><span></span><span class="dl">'+wk.map(function(d){return"<span>"+fmt(d,{weekday:"narrow"})+"</span>";}).join("")+'</span><span class="streak" style="color:inherit">Streak</span>';
  labels.hidden=!rows.length;
  var ol=document.getElementById("roster");ol.innerHTML="";
  rows.forEach(function(r,i){
    var li=el("li",r.name===me?"me":"");
    li.appendChild(el("span","rank",String(i+1)));
    var who=el("span","who",r.name);
    who.appendChild(el("span","chip "+(r.today?"in":"out"),r.today?"Done today":"Not yet"));
    li.appendChild(who);
    var dots=el("span","dots");
    wk.forEach(function(d){var s=el("span","dot"+(r.days[d]?" on":"")+(d===today?" today":"")+(d>today?" future":""));s.title=fmt(d,{weekday:"short",month:"short",day:"numeric"});dots.appendChild(s);});
    li.appendChild(dots);
    li.appendChild(el("span","streak",r.streak?r.streak+(r.streak>1?" days":" day"):"–"));
    ol.appendChild(li);
  });
  var note=document.getElementById("boardNote");
  note.hidden=rows.length>0;
  note.textContent="No names on the roster yet. Your leader can add them in the Leaders section below.";
}

function renderWho(){
  var box=document.getElementById("whoami");box.innerHTML="";
  if(INVITE&&D.me){
    box.className="whoami set";
    box.appendChild(el("span",null,"Checking in as "+D.me));
    var rb=el("button","btn2","Get reminders");rb.type="button";
    rb.onclick=function(){try{window.top.postMessage({fsy:{askReminders:true}},"*");}catch(e){}};
    box.appendChild(rb);
    return;
  }
  if(me&&D.roster.indexOf(me)>=0){
    box.className="whoami set";
    box.appendChild(el("span",null,"Checking in as "+me));
    var b=el("button","linkbtn","Not you?");b.onclick=function(){me=null;try{localStorage.removeItem(nameKey());}catch(e){}renderAll();};
    box.appendChild(b);return;
  }
  box.className="whoami";
  var pk=el("button","btn2","Tap your name to set up this phone");pk.type="button";pk.onclick=function(){showJoin(D.youthCode);};box.appendChild(pk);
}

function renderCard(){
  var first=D.readings.length?D.readings[0].date:D.today, last=D.readings.length?D.readings[D.readings.length-1].date:D.today;
  document.getElementById("navDate").innerHTML=fmt(viewing,{weekday:"long",month:"short",day:"numeric"})+"<small>"+(viewing===D.today?"Today's reading":viewing<D.today?"Past reading":"Coming up")+"</small>";
  document.getElementById("prev").disabled=viewing<=first;
  document.getElementById("next").disabled=viewing>=last&&viewing>=D.today;
  var card=document.getElementById("card");card.innerHTML="";
  var r=null;D.readings.forEach(function(x){if(x.date===viewing)r=x;});
  if(!r&&viewing===D.today)r=FALLBACK;
  if(!r){card.appendChild(el("div","loading","No reading is set for this day yet. New readings get added each month."));return;}
  var isSun=parse(viewing).getDay()===0;
  var tag=el("div","tag");
  var t1=el("span");t1.appendChild(el("b",null,"Preparing for "));t1.appendChild(document.createTextNode(isSun?"today":fmt(sundayFor(viewing),{weekday:"long",month:"short",day:"numeric"})));
  tag.appendChild(t1);tag.appendChild(el("span",null,r.lesson||""));card.appendChild(tag);
  var body=el("div","body");
  body.appendChild(el("h2",null,r.title));
  var rd=el("div","read");rd.appendChild(el("span","lbl","Read"));var a=el("a",null,r.ref);a.href=r.refUrl;rd.appendChild(a);body.appendChild(rd);
  body.appendChild(el("p","thought",r.thought));
  var p=el("div","ponder");p.appendChild(el("span","lbl",isSun?"Bring to class":"Think about"));p.appendChild(el("p",null,r.ask));body.appendChild(p);
  if(r.lessonUrl){var la=el("a",null,"See Sunday's lesson in the magazine →");la.href=r.lessonUrl;la.style.fontSize=".88rem";body.appendChild(la);}
  card.appendChild(body);
  var foot=el("div","foot");card.appendChild(foot);
  var mine=me?daysFor(me):{};
  if(mine[viewing]){foot.appendChild(el("div","done","✓ Checked in "+(viewing===D.today?"today":"for this day")+". See you Sunday."));return;}
  if(viewing!==D.today){foot.appendChild(el("p","small",viewing<D.today?"Check-ins count on the day of the reading. Today's reading is waiting for you.":"This reading opens on "+fmt(viewing,{weekday:"long"})+"."));return;}
  if(!INVITE){foot.appendChild(el("p","small","Set up this phone first (button at the top) so your check-in counts."));return;}
  var lab=el("label",null,"What stood out to you, or what will you bring Sunday? (required, your adviser can see this)");lab.htmlFor="thoughtInput";foot.appendChild(lab);
  var ta=el("textarea");ta.id="thoughtInput";ta.maxLength=400;ta.placeholder="One or two sentences...";foot.appendChild(ta);
  try{var dr=localStorage.getItem("fsy-draft-"+D.today);if(dr)ta.value=dr;}catch(e){}
  var hint=el("p","small","");foot.appendChild(hint);
  var btn=el("button","confirm",saving?"Saving…":"I read it and thought about it");foot.appendChild(btn);
  function gate(){var n=ta.value.trim().length;btn.disabled=saving||n<15;hint.textContent=n<15?"Write at least a sentence to check in.":"";try{localStorage.setItem("fsy-draft-"+D.today,ta.value);}catch(e){}}
  ta.oninput=gate;gate();
  if(errMsg)foot.appendChild(el("p","err",errMsg));
  btn.onclick=function(){
    saving=true;errMsg="";btn.disabled=true;btn.textContent="Saving…";
    google.script.run
      .withSuccessHandler(function(data){try{localStorage.removeItem("fsy-draft-"+D.today);}catch(x){}D=data;saving=false;renderAll();})
      .withFailureHandler(function(e){saving=false;errMsg=(e&&e.message)||"That didn't save. Check your connection and try again.";renderAll();})
      .checkIn(WARD,me,ta.value,INVITE,LEGACY);
  };
}

function renderAll(){
  document.getElementById("eyebrow").textContent = D.ward && !D.ward.isDefault ? D.ward.name+" · Daily Prep" : "Aaronic Priesthood · Daily Prep";
  if(INVITE&&D.me){me=D.me;}
  if(!me&&NAME_PARAM&&D.roster.indexOf(NAME_PARAM)>=0){me=NAME_PARAM;ls(nameKey(),me);}
  if(!me){var old=ls("fsy-name");if(WARD&&old&&D.roster.indexOf(old)>=0){me=old;ls(nameKey(),me);}}
  tellParent();
  renderBoard();renderWho();renderCard();
}
document.getElementById("prev").onclick=function(){viewing=shift(viewing,-1);renderCard();};
document.getElementById("next").onclick=function(){viewing=shift(viewing,1);renderCard();};

/* ---------- views: app, ward code, leader, setup ---------- */
var appEls=[document.querySelector("header.board"),document.querySelector("main")];
var alt=document.getElementById("alt");
function showApp(){alt.hidden=true;alt.innerHTML="";appEls.forEach(function(x){x.hidden=false;});}
function showAlt(){appEls.forEach(function(x){x.hidden=true;});alt.hidden=false;alt.innerHTML="";window.scrollTo(0,0);return alt;}
function backBtn(){var b=el("button","linkbtn",D?"‹ Back to today's reading":"‹ Back");b.type="button";b.onclick=function(){if(D){showApp();}else{loadApp();}};return b;}
function panel(title){var p=el("div","panel");if(title)p.appendChild(el("h3",null,title));return p;}
function field(label,id,tag,ph){var f=el("div","field");var l=el("label",null,label);l.htmlFor=id;var i=el(tag||"input");i.id=id;if(ph)i.placeholder=ph;f.appendChild(l);f.appendChild(i);return {wrap:f,input:i};}
function errLine(){return el("p","err","");}
function copyRow(value){
  var r=el("div","row2");var i=el("input");i.readOnly=true;i.value=value;i.onclick=function(){i.select();};
  var b=el("button","btn2","Copy");b.type="button";
  b.onclick=function(){
    function done(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy";},1500);}
    try{navigator.clipboard.writeText(value).then(done,function(){i.select();});}catch(e){i.select();}
  };
  r.appendChild(i);r.appendChild(b);return r;
}
function copyOrShow(btn,msg,after){
  function show(){
    btn.textContent="Copy link";
    var box=el("textarea");box.readOnly=true;box.value=msg;box.rows=3;box.style.width="100%";
    var wrap=el("div");wrap.appendChild(el("p","small","Your phone blocked copying here. Press and hold the text below, then tap Select All and Copy."));wrap.appendChild(box);
    (after||btn).after(wrap);box.focus();box.select();
  }
  try{
    navigator.clipboard.writeText(msg).then(function(){btn.textContent="Copied";setTimeout(function(){btn.textContent="Copy link";},1500);},show);
  }catch(e){show();}
}
function run(fn,args,ok,fail){
  var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){fail((e&&e.message)||"Something went wrong. Check your connection and try again.");});
  r[fn].apply(r,args);
}

function showJoin(code,msg){
  var a=showAlt();a.appendChild(el("div","loading","Loading your quorum…"));
  run("joinInfo",[code],function(info){
    var a2=showAlt();
    var p=panel("Welcome to FSY Daily Prep");
    p.appendChild(el("p",null,info.wardName+": tap your name. This sets up your phone. You only do it once."));
    if(msg)p.appendChild(el("p","err",msg));
    var list=el("div","names");
    info.names.forEach(function(n){
      var b=el("button","namebtn"+(n.joined?" taken":""),n.name);b.type="button";
      if(n.joined)b.appendChild(el("span","small"," · already set up"));
      b.onclick=function(){claim(code,n.name,b);};
      list.appendChild(b);
    });
    if(!info.names.length)list.appendChild(el("p","small","Your leader hasn't added any names yet."));
    p.appendChild(list);
    p.appendChild(el("p","small","Don't see your name? Ask your leader to add you."));
    a2.appendChild(p);
  },function(m){WARD="";ls("fsy-ward",null);showWelcome(m);});
}
function claim(code,name,btn){
  btn.disabled=true;
  run("claimName",[code,name,LEGACY],function(res){
    INVITE=res.invite;ls("fsy-invite",INVITE);me=name;ls(nameKey(),name);tellParent();D=null;showApp();loadApp();
  },function(m){
    btn.disabled=false;
    if(m==="TAKEN"){
      var a=showAlt();a.appendChild(backBtn());
      var p=panel(name+" is already set up");
      p.appendChild(el("p",null,"Your name is set up on another phone. If that's you on a new phone or you got logged out, ask your leaders to reset you. Then come back and tap your name."));
      var e=errLine();var b=el("button","confirm","Ask my leaders to reset me");b.type="button";p.appendChild(b);p.appendChild(e);
      b.onclick=function(){b.disabled=true;run("requestReset",[code,name],function(r){p.innerHTML="";p.appendChild(el("h3",null,"Request sent"));p.appendChild(el("p",null,r.message));},function(x){b.disabled=false;e.textContent=x;});};
      a.appendChild(p);
    } else { alert2(btn,m); }
  });
}
function alert2(after,m){var e=el("p","err",m);after.after(e);setTimeout(function(){e.remove();},6000);}

var leaderFirst=!!LEADER_PARAM;
function loadApp(){
  if(leaderFirst){leaderFirst=false;showLeaderView();return;}
  if(!INVITE&&JOIN_PARAM){var jc=JOIN_PARAM;JOIN_PARAM="";showJoin(jc);return;}
  if(!WARD&&!INVITE&&!LEGACY){showWelcome("");return;}
  run("getData",[WARD,INVITE,LEGACY],function(data){
    D=data;
    if(INVITE&&data.youthCode&&!data.ward.isDefault){WARD=data.youthCode;ls("fsy-ward",WARD);}
    if(!INVITE){
      // older phones: move them onto their own sign-in automatically
      if(me&&D.roster.indexOf(me)>=0){
        run("claimName",[LEGACY?"":(WARD||data.youthCode),me,LEGACY],function(res){INVITE=res.invite;ls("fsy-invite",INVITE);tellParent();loadApp();},
          function(m){showJoin(data.youthCode,m==="TAKEN"?me+" is already set up on another phone. Tap your name, or ask your leaders to reset you.":m);});
        return;
      }
      showJoin(data.youthCode);return;
    }
    viewing=D.today;showApp();renderAll();
  },function(msg){
    if(INVITE){INVITE="";ls("fsy-invite",null);showWelcome(msg);}
    else if(WARD){WARD="";ls("fsy-ward",null);showWelcome(msg);}
    else if(LEGACY){LEGACY=false;showWelcome("Open your quorum's join link and tap your name.");}
    else{document.getElementById("card").innerHTML="";document.getElementById("card").appendChild(el("div","loading","Couldn't load: "+msg));}
  });
}

function confirmBtn(label,yesLabel,onYes,host){
  var b=el("button","btn2"+(label==="Remove"?" danger":""),label);b.type="button";
  b.onclick=function(){
    var w=el("span","row2");var y=el("button","btn2 danger",yesLabel);y.type="button";var n=el("button","btn2","Cancel");n.type="button";
    w.appendChild(y);w.appendChild(n);host.replaceChild(w,b);
    n.onclick=function(){host.replaceChild(b,w);};
    y.onclick=function(){y.disabled=true;onYes();};
  };
  return b;
}

function renderLeader(L){
  var code=ls("fsy-leader");
  var a=showAlt();
  var top=el("div","row2");top.style.justifyContent="space-between";top.appendChild(backBtn());
  var so=el("button","linkbtn","Sign out");so.type="button";so.onclick=function(){ls("fsy-leader",null);showLeaderView();};top.appendChild(so);a.appendChild(top);
  a.appendChild(el("h2",null,L.ward.name));
  var err=errLine();a.appendChild(err);
  function fail(m){err.textContent=m;window.scrollTo(0,0);}

  // 1. Invite: one link + QR for the whole quorum
  var inv=panel("Invite your quorum");
  inv.appendChild(el("p",null,"Post this link in your quorum's group chat, or show the code in class. Each young man opens it and taps his name once."));
  var qr=el("div","qr");inv.appendChild(qr);
  try{new QRCode(qr,{text:L.joinLink,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});}catch(x){qr.remove();}
  var cr=el("div","row2");var ci=el("input");ci.readOnly=true;ci.value=L.joinLink;ci.onclick=function(){ci.select();};
  var cb=el("button","btn2","Copy link");cb.type="button";cb.onclick=function(){copyOrShow(cb,L.joinLink,cr);};
  cr.appendChild(ci);cr.appendChild(cb);inv.appendChild(cr);
  a.appendChild(inv);

  // 2. Young men: status, this week, add/remove/reset
  var wk=weekOf(L.today);
  var done={};L.checkins.forEach(function(c){done[c.name+"|"+c.date]=1;});
  var joinedN=L.boys.filter(function(b){return b.joined;}).length;
  var ym=panel("Young men ("+L.boys.length+")");
  ym.appendChild(el("p","small",joinedN+" of "+L.boys.length+" have joined. Dots show this week's check-ins."));
  var list=el("div","boys");
  L.boys.forEach(function(b){
    var row=el("div","boy");
    var left=el("div","boyname");left.appendChild(el("span",null,b.name));
    left.appendChild(el("span","chip2 "+(b.joined?"ok":"wait"),b.joined?"Joined":"Not joined yet"));
    var dots=el("span","dots2");var n=0;
    wk.forEach(function(d){var has=done[b.name+"|"+d];if(has)n++;var s=el("span","d2"+(has?" on":"")+(d>L.today?" fut":""));s.title=fmt(d,{weekday:"short"});dots.appendChild(s);});
    left.appendChild(dots);
    row.appendChild(left);
    var acts=el("span","row2 acts");
    if(b.joined)acts.appendChild(confirmBtn("Reset","Yes, reset",function(){run("leaderResetBoy",[code,b.name],renderLeader,fail);},acts));
    acts.appendChild(confirmBtn("Remove","Yes, remove",function(){run("leaderRemoveName",[code,b.name],renderLeader,fail);},acts));
    row.appendChild(acts);list.appendChild(row);
  });
  if(!L.boys.length)list.appendChild(el("p","small","No names yet. Add your young men below."));
  ym.appendChild(list);
  var addT=el("textarea");addT.id="addNames";addT.rows=2;addT.placeholder="Add young men, one per line";
  var addB=el("button","btn2","Add");addB.type="button";
  var ar=el("div","row2");ar.appendChild(addT);ar.appendChild(addB);ym.appendChild(ar);
  addB.onclick=function(){if(!addT.value.trim()){fail("Type a name to add.");return;}addB.disabled=true;run("leaderAddNames",[code,addT.value],renderLeader,function(m){addB.disabled=false;fail(m);});};
  ym.appendChild(el("p","small","Reset: new phone or logged out (he taps his name again). Remove: moved away (his past answers are kept)."));
  a.appendChild(ym);

  // 3. Responses
  var rp=panel("Responses");var sel=el("select");sel.id="respRange";
  [["week","This week"],["14","Last 14 days"],["all","Everything"]].forEach(function(o){sel.appendChild(new Option(o[1],o[0]));});
  var box=el("div");rp.appendChild(sel);rp.appendChild(box);
  function drawResp(){
    box.innerHTML="";var from=sel.value==="week"?wk[0]:sel.value==="14"?shift(L.today,-13):"0000";
    var lst=L.checkins.filter(function(c){return c.date>=from;}).slice().reverse();
    if(!lst.length){box.appendChild(el("p","small","No responses in this range yet."));return;}
    lst.forEach(function(c){var d=el("div","resp");
      d.appendChild(el("div","meta",c.name+" · "+fmt(c.date,{weekday:"short",month:"short",day:"numeric"})+(L.titles[c.date]?" · "+L.titles[c.date]:"")));
      d.appendChild(el("p",null,c.thought));box.appendChild(d);});
  }
  sel.onchange=drawResp;drawResp();a.appendChild(rp);

  // 4. Leaders
  var lp=panel("Leaders");
  lp.appendChild(el("p","small","Everyone here can see responses and gets the 6 PM summary. Adding a leader emails him his sign-in link."));
  var ll=el("div","rlist");
  (L.leaders||[]).forEach(function(v){
    var row=el("div");var nm=el("span",null,v.name);if(v.email)nm.appendChild(el("span","small"," · "+v.email));row.appendChild(nm);
    var bx=el("span","row2");bx.appendChild(confirmBtn("Remove","Yes, remove",function(){run("leaderRemoveLeader",[code,v.name],renderLeader,fail);},bx));
    row.appendChild(bx);ll.appendChild(row);
  });
  lp.appendChild(ll);
  var lad=el("div","row2");var lin=el("input");lin.id="addLeader";lin.placeholder="Name, like Bro. Smith";
  var lem=el("input");lem.id="addLeaderEmail";lem.type="email";lem.placeholder="Email";
  var lab=el("button","btn2","Add leader");lab.type="button";
  lad.appendChild(lin);lad.appendChild(lem);lad.appendChild(lab);lp.appendChild(lad);
  lab.onclick=function(){
    if(!lin.value.trim()){fail("Enter the leader's name.");return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(lem.value.trim())){fail("Enter the leader's email.");return;}
    lab.disabled=true;run("leaderAddLeader",[code,lin.value,lem.value.trim()],renderLeader,function(m){lab.disabled=false;fail(m);});
  };
  a.appendChild(lp);

  // 5. Small print: change the join link if it spreads too far
  var cp=panel(null);
  cp.appendChild(el("p","small","Join link shared too widely? Make a new one. The old link stops working; young men already set up aren't affected."));
  var nb=el("span","row2");nb.appendChild(confirmBtn("New join link","Yes, make a new one",function(){run("leaderNewCode",[code,"youth"],function(){run("leaderData",[code],renderLeader,fail);},fail);},nb));
  cp.appendChild(nb);a.appendChild(cp);
}
